<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Vending Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .machine-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid #e1e4e8;
        }

        h1 {
            color: #1a1f36;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .status-panel {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #edf2f7;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .status-label {
            color: #697386;
            font-weight: 600;
        }

        .status-value {
            color: #1a1f36;
            font-family: monospace;
        }

        .shelves {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .item-slot {
            background: #fff;
            border: 2px solid #e3e8ee;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.2s;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .item-slot.active {
            cursor: pointer;
            border-color: #635bff;
            opacity: 1;
            background: #f4f7ff;
        }

        .item-slot:hover.active {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 91, 255, 0.1);
        }

        .door-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #d97706;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #3c4257;
            color: white;
        }

        button:disabled {
            background: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .indicator.red {
            background-color: #ef4444;
        }

        .indicator.green {
            background-color: #22c55e;
        }

        .lock-status {
            font-size: 48px;
            margin: 10px 0;
        }

        .lock-status.locked {
            color: #ef4444;
        }

        .lock-status.unlocked {
            color: #22c55e;
        }

        /* Hidden by default, shown when enabled */
        .interaction-area {
            margin-top: 20px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #635bff;
            background: white;
            color: #635bff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }

        .qty-btn:hover {
            background: #635bff;
            color: white;
        }

        .qty-value {
            font-size: 18px;
            font-weight: bold;
            min-width: 24px;
            text-align: center;
            color: #1a1f36;
        }

        .qty-value.has-qty {
            color: #635bff;
        }

        .btn-return {
            width: 100%;
            margin-top: 10px;
            padding: 8px 10px;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .btn-return:disabled {
            background: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .item-slot.has-selection {
            border-color: #635bff;
            background: #f4f7ff;
        }

        .summary-box {
            background: #f0fdf4;
            border: 1px solid #22c55e;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .summary-total {
            font-size: 18px;
            font-weight: bold;
            color: #22c55e;
            border-top: 1px solid #e3e8ee;
            padding-top: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="machine-container">
        <h1>Reverse Vending Machine Simulator</h1>

        <div class="status-panel">
            <div class="status-row">
                <span class="status-label">Simulator Status:</span>
                <span class="status-value" id="connection-status"><span class="indicator red"></span>Disconnected</span>
            </div>
            <div class="status-row">
                <span class="status-label">Session ID:</span>
                <input type="text" id="session-id" class="status-value" placeholder="Create Session via App" readonly
                    style="border:none; background:transparent; text-align:right; width:200px;">
            </div>
        </div>

        <div class="lock-status locked" id="lock-icon">🔒</div>
        <div style="margin-bottom: 20px; font-weight: bold; color: #697386;" id="lock-text">LOCKED</div>

        <div class="door-controls">
            <button id="btn-open-door" class="btn-primary" onclick="openDoor()" disabled>Open Door</button>
            <button id="btn-close-door" class="btn-secondary" onclick="closeDoor()" disabled>Close Door</button>
        </div>

        <div class="interaction-area" id="shelves-area" style="opacity: 0.5; pointer-events: none;">
            <p
                style="text-align: left; color: #697386; font-size: 12px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;">
                Products</p>
            <div class="shelves">
                <div class="item-slot active" id="item-small">
                    <div style="font-size: 24px; margin-bottom: 5px;">🍲</div>
                    <div>Small Jar</div>
                    <div style="font-size: 12px; color: #697386;">Refund: $0.50</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty('small_jar', -1)">−</button>
                        <span id="qty-small" class="qty-value">0</span>
                        <button class="qty-btn" onclick="changeQty('small_jar', 1)">+</button>
                    </div>
                    <button id="return-small" class="btn-return" style="width: 100%; margin-top: 10px;"
                        onclick="returnItem('small_jar')" disabled>Perform</button>
                </div>
                <div class="item-slot active" id="item-big">
                    <div style="font-size: 24px; margin-bottom: 5px;">🥣</div>
                    <div>Big Jar</div>
                    <div style="font-size: 12px; color: #697386;">Refund: $0.70</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty('big_jar', -1)">−</button>
                        <span id="qty-big" class="qty-value">0</span>
                        <button class="qty-btn" onclick="changeQty('big_jar', 1)">+</button>
                    </div>
                    <button id="return-big" class="btn-return" style="width: 100%; margin-top: 10px;"
                        onclick="returnItem('big_jar')" disabled>Perform</button>
                </div>
            </div>
        </div>

        <div id="summary-box" class="summary-box" style="display: none;">
            <div class="summary-row">
                <span>Eligible Jars:</span>
                <span id="eligible-count">0</span>
            </div>
            <div class="summary-row">
                <span>Foreign Jars:</span>
                <span id="foreign-count">0</span>
            </div>
            <div class="summary-row summary-total">
                <span>Total Refund:</span>
                <span id="total-refund">$0.00</span>
            </div>
        </div>
    </div>

    <div style="width:100%; max-width:600px; margin-top:20px; text-align:left;">
        <strong style="color:#697386; font-size:12px; text-transform:uppercase;">Device Log</strong>
        <div id="log"
            style="background:#fff; height:150px; overflow-y:scroll; border:1px solid #e1e4e8; padding:10px; font-family:monospace; font-size:12px; border-radius:6px; margin-top:5px;">
        </div>
    </div>

    <script>
        const baseUrl = "";
        let lastEventTimestamp = Date.now() - 30000;
        let isDoorUnlocked = false;
        let isDoorOpen = false;
        let doorTimer = null;
        let currentSessionId = null;

        let totalEligibleVal = 0;
        let totalForeignCount = 0;
        let totalRefundAmount = 0;

        let stagingQuantities = { small_jar: 0, big_jar: 0 };

        async function pollEvents() {
            try {
                const res = await fetch(`${baseUrl}/simulate/events?since=${lastEventTimestamp}`);
                const data = await res.json();

                if (data.events && data.events.length > 0) {
                    data.events.forEach(e => {
                        log(`[${e.source.toUpperCase()}] ${e.message}`, e.type);
                        lastEventTimestamp = Math.max(lastEventTimestamp, e.timestamp);

                        if (e.message.includes('Session Created')) {
                            const sidMatch = e.message.match(/sess_[a-z0-9]+/i);
                            if (sidMatch) {
                                currentSessionId = sidMatch[0];
                                document.getElementById('session-id').value = currentSessionId;
                                resetStaging();
                            }
                            handleUnlock();
                        }

                        if (e.message.includes('Payment Captured') || e.message.includes('Pre-auth Released')) {
                            log("💳 " + e.message, e.type);
                        }
                    });
                }
            } catch (e) { }
        }

        function handleUnlock() {
            if (isDoorUnlocked) return;
            isDoorUnlocked = true;
            updateUI();
            log("🔓 Door UNLOCKED - Insert jars!", "success");

            if (doorTimer) clearTimeout(doorTimer);
            doorTimer = setTimeout(async () => {
                log("⏰ TIMEOUT: Door re-locked", "warning");

                const sessionId = currentSessionId || document.getElementById('session-id').value;
                if (sessionId) {
                    try {
                        await fetch(`${baseUrl}/simulate/timeout`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ session_id: sessionId })
                        });
                    } catch (e) {
                        console.error("Failed to notify backend of timeout", e);
                    }
                }

                isDoorUnlocked = false;
                isDoorOpen = false;
                currentSessionId = null;
                document.getElementById('session-id').value = '';
                resetStaging();
                updateUI();
            }, 15000);
        }

        function updateUI() {
            const btnOpen = document.getElementById('btn-open-door');
            const btnClose = document.getElementById('btn-close-door');
            const lockIcon = document.getElementById('lock-icon');
            const lockText = document.getElementById('lock-text');
            const shelvesArea = document.getElementById('shelves-area');
            const statusEl = document.getElementById('connection-status');

            statusEl.innerHTML = currentSessionId
                ? '<span class="indicator green"></span>Connected'
                : '<span class="indicator red"></span>Disconnected';

            if (isDoorUnlocked) {
                lockIcon.innerText = "🔓";
                lockIcon.className = "lock-status unlocked";
                lockText.innerText = "UNLOCKED";

                if (isDoorOpen) {
                    btnOpen.disabled = true;
                    btnOpen.innerText = "Door is Open";
                    btnClose.disabled = false;
                    shelvesArea.style.opacity = "1.0";
                    shelvesArea.style.pointerEvents = "auto";
                } else {
                    btnOpen.disabled = false;
                    btnOpen.innerText = "Open Door";
                    btnOpen.className = "btn-primary";
                    btnClose.disabled = true;
                    shelvesArea.style.opacity = "0.5";
                    shelvesArea.style.pointerEvents = "none";
                }
            } else {
                btnOpen.disabled = true;
                btnOpen.innerText = "Open Door";
                btnOpen.className = "btn-primary";
                btnClose.disabled = true;
                lockIcon.innerText = "🔒";
                lockIcon.className = "lock-status locked";
                lockText.innerText = "LOCKED";
                shelvesArea.style.opacity = "0.5";
                shelvesArea.style.pointerEvents = "none";
            }
        }

        async function openDoor() {
            if (!isDoorUnlocked) return;
            const sessionId = currentSessionId || document.getElementById('session-id').value;
            try {
                await fetch(`${baseUrl}/simulate/door-open`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId || 'manual_open' })
                });
                log("🚪 Door OPENED - Ready for jars!", "success");
                isDoorOpen = true;
                if (doorTimer) clearTimeout(doorTimer);
                updateUI();
            } catch (e) { console.error(e); }
        }

        async function closeDoor() {
            const sessionId = currentSessionId || document.getElementById('session-id').value;
            try {
                await fetch(`${baseUrl}/simulate/door-close`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId || 'manual_close' })
                });
                log("🚪 Door CLOSED - Session complete!", "info");
                isDoorUnlocked = false;
                isDoorOpen = false;
                currentSessionId = null;
                document.getElementById('session-id').value = '';

                // Show final summary
                if (totalEligibleVal > 0 || totalForeignCount > 0) {
                    log(`💰 Session Total: ${totalEligibleVal} eligible, ${totalForeignCount} foreign = $${(totalRefundAmount / 100).toFixed(2)} refund`, "success");
                }
                totalEligibleVal = 0;
                totalForeignCount = 0;
                totalRefundAmount = 0;
                resetStaging();
                updateUI();
                updateTotals();
            } catch (e) { console.error(e); }
        }

        function changeQty(type, delta) {
            if (!isDoorOpen) return;
            stagingQuantities[type] += delta;
            updateShelfUI();
        }

        function updateShelfUI() {
            for (let type in stagingQuantities) {
                const idSfx = type === 'small_jar' ? 'small' : 'big';
                const qtyEl = document.getElementById(`qty-${idSfx}`);
                const itemEl = document.getElementById(`item-${idSfx}`);
                const btn = document.getElementById(`return-${idSfx}`);
                const qty = stagingQuantities[type];
                qtyEl.textContent = qty > 0 ? `+${qty}` : qty;
                qtyEl.classList.toggle('has-qty', qty !== 0);
                qtyEl.style.color = qty < 0 ? '#ef4444' : (qty > 0 ? '#22c55e' : '#697386');

                itemEl.classList.toggle('has-selection', qty !== 0);
                if (qty < 0) {
                    itemEl.style.borderColor = '#ef4444';
                    itemEl.style.backgroundColor = '#fef2f2';
                    btn.innerText = "Undo";
                    btn.style.backgroundColor = "#dc2626";
                    btn.style.color = "white";
                } else if (qty > 0) {
                    itemEl.style.borderColor = '#22c55e';
                    itemEl.style.backgroundColor = '#f0fdf4';
                    btn.innerText = "Perform";
                    btn.style.backgroundColor = "#16a34a";
                    btn.style.color = "white";
                } else {
                    itemEl.style.borderColor = '#e3e8ee';
                    itemEl.style.backgroundColor = '#fff';
                    btn.innerText = "Perform";
                    btn.style.backgroundColor = "";
                    btn.style.color = "";
                }
                btn.disabled = qty === 0 || !isDoorOpen;
            }
            updateTotals();
        }

        function updateTotals() {
            document.getElementById('eligible-count').textContent = totalEligibleVal;
            document.getElementById('foreign-count').textContent = totalForeignCount;
            document.getElementById('total-refund').textContent = `$${(totalRefundAmount / 100).toFixed(2)}`;
            document.getElementById('summary-box').style.display = (totalEligibleVal + totalForeignCount) > 0 ? 'block' : 'none';
        }

        function resetStaging() {
            stagingQuantities = { small_jar: 0, big_jar: 0 };
            updateShelfUI();
        }

        async function returnItem(type) {
            if (!currentSessionId) return alert("No active session!");
            if (!isDoorOpen) return;

            const qty = stagingQuantities[type];
            if (qty === 0) return;

            const absQty = Math.abs(qty);
            const isUndo = qty < 0;

            log(`📦 ${isUndo ? 'Undoing' : 'Processing'} ${absQty}x ${type === 'small_jar' ? 'Small' : 'Big'} jars...`, "info");

            if (isUndo) {
                // For undo, we use item-removed but with return logic (negative price)
                const price = type === 'small_jar' ? -50 : -70; // Refund amount is negative
                for (let i = 0; i < absQty; i++) {
                    try {
                        const res = await fetch(`${baseUrl}/simulate/item-removed`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                session_id: currentSessionId,
                                item_id: type === 'small_jar' ? 3 : 4,
                                price: price
                            })
                        });
                        if (!res.ok) {
                            const errorData = await res.json();
                            log(`⚠️ ${errorData.error}`, "warning");
                            break;
                        }
                        log(`✅ Undid 1x ${type === 'small_jar' ? 'Small' : 'Big'} Jar insertion`, "success");
                        // We need to adjust the local counters too
                        if (type === 'small_jar') totalRefundAmount += 50; else totalRefundAmount += 70;
                        totalEligibleVal--;
                    } catch (e) {
                        console.error(e);
                        log("❌ Error undoing return", "error");
                        break;
                    }
                }
            } else {
                await processJar(type, qty);
            }

            stagingQuantities[type] = 0;
            updateShelfUI();
            updateUI();
            updateTotals();
        }

        async function processJar(type, qty) {
            try {
                const res = await fetch(`${baseUrl}/simulate/item-returned`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: currentSessionId, jar_type: type, qty: qty })
                });
                const data = await res.json();

                if (data.eligible > 0) {
                    const refundPer = type === 'small_jar' ? 50 : 70;
                    const refund = data.eligible * refundPer;
                    log(`✅ ${data.eligible}x Eligible ${type === 'small_jar' ? 'Small' : 'Big'} Jars (+$${(refund / 100).toFixed(2)})`, "success");
                    totalEligibleVal += data.eligible;
                    totalRefundAmount += refund;
                }
                if (data.foreign > 0) {
                    log(`⚠️ ${data.foreign}x Foreign ${type === 'small_jar' ? 'Small' : 'Big'} Jars (No purchase history)`, "warning");
                    totalForeignCount += data.foreign;
                }
            } catch (e) {
                console.error(e);
                log("❌ Error processing return", "error");
            }
        }

        updateUI();
        resetStaging();
        setInterval(pollEvents, 1000);

        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            if (!el) return;
            const colors = { 'success': '#22c55e', 'error': '#ef4444', 'warning': '#f59e0b', 'info': '#3b82f6' };
            const color = colors[type] || '#333';
            el.innerHTML = `<div style="color: ${color}; font-weight: ${type !== 'info' ? 'bold' : 'normal'}">${new Date().toLocaleTimeString()} - ${msg}</div>` + el.innerHTML;
        }
    </script>
</body>

</html>
